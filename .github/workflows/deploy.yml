name: Deploy PHP to InfinityFree via FTP

on:
  push:
    branches:
      - main  

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: FTP Deploy to InfinityFree
      uses: SamKirkland/FTP-Deploy-Action@v4.1.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./      # folder containing your PHP files
        server-dir: /htdocs/
