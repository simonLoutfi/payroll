name: CI/CD - PHP Deploy to InfinityFree via FTP

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'  
        extensions: mbstring, intl, pdo, pdo_mysql
        coverage: none

    - name: Install dependencies (if composer.json exists)
      run: |
        if [ -f composer.json ]; then
          composer install --no-interaction --prefer-dist
        else
          echo "No composer.json found, skipping install."
        fi

    - name: Lint PHP files
      run: find . -type f -name "*.php" -exec php -l {} \;

    - name: Run PHPUnit tests
      run: |
        if [ -f vendor/bin/phpunit ]; then
          vendor/bin/phpunit
        else
          echo "PHPUnit not found, skipping tests."
        fi

  deploy:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: FTP Deploy to InfinityFree
      uses: SamKirkland/FTP-Deploy-Action@v4.1.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /htdocs/
